1,"ring":0,"p":[4,25,89]},{"id":"F","line":"U4","H":10,"ph":6.2,"ring":0,"p":[15,26,92,39,32,6,12,31,69,36,49,8]}]};

/* ---------- Zustand ---------- */
const $=s=>document.querySelector(s);
const cv=$('#c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,K,K0,cx,cy,zoom=1,zoomT=1,tI=1,view='iso';
let pos={...FALLBACK,real:false}, lastFetchPos=null;
let stations=[], stById=new Map(), ships=new Map();
let mode=API?'LIVE':'SIM', lastOk=0, failed=false, busy=false;
try{view=store.get('view')==='top'?'top':'iso';tI=view==='iso'?1:0;}catch(e){}
let pins=[];try{pins=JSON.parse(store.get('pins')||'[]').filter(p=>/^S\d+$/.test(p.id))}catch(e){}
let focusId=null, tmp=null;           // Fokus auf eine Station (null = ich)
let cmpOn=false, lastOri=0, hs=0, hc=1, rotCur=0, cR=1, sR=0;

const COL={U1:'#3d8bff',U2:'#ff4d6d',U3:'#ffd23a',U4:'#2ef2c0'};
const col=l=>COL[l]||'#b97bff';
const C=Math.SQRT1_2, TAU=Math.PI*2;

function resize(){
  const d=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=Math.max(innerHeight,(navigator.standalone&&innerWidth<innerHeight)?screen.height:0);
  cv.width=W*d;cv.height=H*d;cv.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0);
  K0=W*0.47/RANGE;cx=W/2;cy=H*0.45;K=K0*zoom;
}
addEventListener('resize',resize);resize();

/* isometrische Projektion: x=Ost, y=Nord (Meter), z=Höhe (Pixel) */
function P(x,y,z=0){
  const a=x*cR-y*sR,b=x*sR+y*cR, ix=(a-b)*C, iy=-(a+b)*C*0.5;
  return [cx+(a+(ix-a)*tI)*K, cy+(-b+(iy+b)*tI)*K-z*tI];
}
const clampZ=z=>Math.min(5,Math.max(0.45,z));
const sMul=()=>Math.min(2.2,Math.max(0.55,1/Math.sqrt(zoom)));
function relFrom(o,lat,lon){return {x:(lon-o.lon)*111320*Math.cos(o.lat*Math.PI/180), y:(lat-o.lat)*110540};}
function focusSt(){return focusId?(stById.get(focusId)||pins.find(p=>p.id===focusId)||tmp):null;}
function rel(lat,lon){return relFrom(focusSt()||pos,lat,lon);}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return (h>>>0);}
function angFor(sid,line,dirId){return (((hash(sid+'|'+line)%180)+(dirId==1?0:180))*Math.PI/180);}

/* ---------- Daten ---------- */
/* Echte Streckengeometrie auch für Live-Daten: Fahrtziel + Streckenfolge, abgesichert durch die Reihenfolge der Ankunftszeiten an Nachbarstationen */
const idxOf=id=>/^S\d+$/.test(id)?+id.slice(1):-1;
function uvIdx(a,b){const r=relFrom({lat:NET.st[a][1],lon:NET.st[a][2]},NET.st[b][1],NET.st[b][2]),l=Math.hypot(r.x,r.y)||1;return [r.x/l,r.y/l];}
function dirsFor(i,line){
  const out=[];
  for(const r of NET.routes){ if(r.line!==line) continue; const j=r.p.indexOf(i); if(j<0) continue; out.push({r,sign:1,j},{r,sign:-1,j}); }
  return out;
}
function stepIdx(o,k){
  const N=o.r.p.length; let q=o.j+o.sign*k;
  if(o.r.ring) q=((q%N)+N)%N; else if(q<0||q>=N) return null;
  return o.r.p[q];
}
function costFor(o,D){
  const d=nrm(D),N=o.r.p.length;
  for(let k=1;k<=N;k++){const q=stepIdx(o,k); if(q==null) return Infinity; const nm=nrm(NET.st[q][0]); if(nm.length>=4&&d.includes(nm)) return k;}
  return Infinity;
}
function resolveDirs(st){
  const i=idxOf(st.id); if(i<0) return null;
  const by={};
  for(const d of st.deps){const g=(by[d.line]=by[d.line]||{});(g[d.dirId]=g[d.dirId]||new Set()).add(d.dir||'');}
  const res={}, key=o=>NET.routes.indexOf(o.r)+':'+o.sign;
  for(const line in by){
    const cands=dirsFor(i,line); if(!cands.length) continue;
    const gs=Object.keys(by[line]).map(id=>{
      let best=null,bc=Infinity;
      for(const o of cands) for(const D of by[line][id]){const c=costFor(o,D);if(c<bc){bc=c;best=o;}}
      return {id,o:best,c:bc};
    });
    const used=new Set(), order=gs.slice().sort((a,b)=>a.c-b.c);
    for(const g of order){
      let o=g.o;
      if(!o||used.has(key(o))){
        const pv=order.find(x=>x.fin&&x!==g);
        o=pv?cands.find(c=>c.r===pv.fin.r&&c.sign===-pv.fin.sign):cands[0];
        if(!o||used.has(key(o))) o=cands.find(c=>!used.has(key(c)))||o;
      }
      g.fin=o; if(o) used.add(key(o));
    }
    res[line]={}; gs.forEach(g=>{res[line][g.id]=g.fin;});
  }
  return res;
}
function enrich(list){
  const bySid={};
  for(const s of list) for(const d of s.deps) (bySid[d.sid]=bySid[d.sid]||[]).push({s,d});
  const unit=(a,b)=>{const r=relFrom(a,b.lat,b.lon),l=Math.hypot(r.x,r.y)||1;return [r.x/l,r.y/l];};
  const votes={};
  for(const s of list){
    const res=s.deps.some(d=>!d.vin)?resolveDirs(s):null;
    for(const d of s.deps){
      if(d.vin) continue;
      let vin=null,vout=null;
      const f=res&&res[d.line]&&res[d.line][d.dirId];
      if(f){
        const i=idxOf(s.id),nx=stepIdx(f,1),pv=stepIdx({...f,sign:-f.sign},1);
        if(nx!=null) vout=uvIdx(i,nx); if(pv!=null) vin=uvIdx(i,pv);
        if(!vout&&vin) vout=[-vin[0],-vin[1]]; if(!vin&&vout) vin=[-vout[0],-vout[1]];
      }
      let vn=null,vp=null,bn=1e9,bp=-1e9;
      for(const e of bySid[d.sid]){
        if(e.s===s) continue;
        if(e.d.min>d.min&&e.d.min<bn){bn=e.d.min;vn=unit(s,e.s);}
        if(e.d.min<d.min&&e.d.min>bp){bp=e.d.min;vp=unit(s,e.s);}
      }
      d._vn=vn;d._vp=vp;
      if(vin&&vout){
        const k=s.id+'|'+d.line+'|'+d.dirId, v=votes[k]||(votes[k]={a:0,b:0});
        if(vn){(vout[0]*vn[0]+vout[1]*vn[1]>0)?v.a++:v.b++;}
        if(vp){(vin[0]*vp[0]+vin[1]*vp[1]>0)?v.a++:v.b++;}
      }
      d.vin=vin;d.vout=vout;
    }
  }
  for(const s of list) for(const d of s.deps){
    if(d._vn===undefined) continue;
    const v=votes[s.id+'|'+d.line+'|'+d.dirId];
    if(d.vin&&v&&v.b>v.a){const t=d.vin;d.vin=d.vout;d.vout=t;}
    else if(!d.vin){
      if(d._vn){d.vout=d._vn;d.vin=[-d._vn[0],-d._vn[1]];}
      else if(d._vp){d.vin=d._vp;d.vout=[-d._vp[0],-d._vp[1]];}
    }
  }
}
function ingest(data){
  const t0=Date.now();
  stations=data.stations.map(s=>{
    if(/^S\d+$/.test(s.id)) return s;
    let b=-1,bd=1e9;NET.st.forEach((e,i)=>{const dd=Math.hypot((e[2]-s.lon)*68000,(e[1]-s.lat)*110540);if(dd<bd){bd=dd;b=i;}});
    return bd<220?{...s,id:'S'+b,name:NET.st[b][0],lat:NET.st[b][1],lon:NET.st[b][2]}:s;
  });
  enrich(stations);
  stById=new Map(stations.map(s=>[s.id,s]));
  const seen=new Set();
  for(const s of stations) for(const d of s.deps){
    const key=s.id+'|'+d.sid; seen.add(key);
    let sh=ships.get(key);
    const at=t0+d.min*60000;
    if(!sh){sh={key,sid:s.id,tid:d.sid,line:d.line,ang:angFor(s.id,d.line,d.dirId),slipN:0,prog:t0,lastAt:at,lastT:t0,stall:false};ships.set(key,sh);}
    else{
      const el=t0-sh.lastT, da=at-sh.lastAt;
      if(el>=10000){
        if(da>=Math.max(12000,0.6*el)) sh.slipN++;
        else if(da<0.3*el){sh.slipN=0;sh.prog=t0;sh.stall=false;}
        if(sh.slipN>=2&&!sh.stall){sh.stall=true;sh.stallFrom=sh.prog;}
        sh.lastAt=at;sh.lastT=t0;
      }
    }
    if(sh.stall) sh.hold=(at-t0)/60000;
    sh.at=at; sh.delay=d.delay||0; sh.dir=d.dir||''; sh.vin=d.vin||null; sh.vout=d.vout||null; sh.end=!!d.end;
  }
  for(const [k,sh] of ships){
    if(!stById.has(sh.sid) || (!seen.has(k) && sh.at>t0+20000)) ships.delete(k);
  }
}

async function pull(){
  if(busy) return; busy=true; lastFetchPos={...pos};
  try{
    if(API){
      const r=await fetch(`${API}/nearby?lat=${pos.lat.toFixed(5)}&lon=${pos.lon.toFixed(5)}&r=1000&p=${encodeURIComponent(pins.map(p=>p.lat.toFixed(5)+','+p.lon.toFixed(5)).join('|'))}`,{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      ingest(await r.json()); mode='LIVE';
    } else { ingest(simulate()); mode='SIM'; }
    lastOk=Date.now(); failed=false;
  }catch(e){ failed=true; }
  busy=false; hud();
}

/* Fahrplan-Simulation auf dem echten Netz: echte Stationen, echte Streckenfolge, Takt vereinfacht (nicht live) */
let simStall=null;
function simulate(){
  const nowM=Date.now()/60000;
  const nameOf=i=>NET.st[i][0];
  const vec=(a,b)=>{const r=relFrom({lat:NET.st[a][1],lon:NET.st[a][2]},NET.st[b][1],NET.st[b][2]);const l=Math.hypot(r.x,r.y)||1;return [r.x/l,r.y/l,Math.hypot(r.x,r.y)];};
  const idx=new Set(NET.st.map((e,i)=>{const r=relFrom(pos,e[1],e[2]);return [i,Math.hypot(r.x,r.y)];}).filter(a=>a[1]<=1000).sort((a,b)=>a[1]-b[1]).slice(0,6).map(a=>a[0]));
  pins.forEach(p=>idx.add(+p.id.slice(1)));
  if(focusId&&/^S\d+$/.test(focusId)) idx.add(+focusId.slice(1));
  const st={};idx.forEach(i=>st[i]={id:'S'+i,name:nameOf(i),lat:NET.st[i][1],lon:NET.st[i][2],deps:[]});
  for(const r of NET.routes) for(const dir of [1,-1]){
    const seq=dir>0?r.p:r.p.slice().reverse(), N=seq.length, cum=[0];
    for(let k=1;k<N;k++) cum.push(cum[k-1]+vec(seq[k-1],seq[k])[2]/700+0.6);
    const dirName=r.ring?(dir>0?'Ring (gegen Uhrzeigersinn)':'Ring (im Uhrzeigersinn)'):nameOf(seq[N-1]);
    for(let j=0;j<N;j++){
      const s=st[seq[j]]; if(!s) continue;
      const base=r.ph+(dir>0?0:r.H/2)+cum[j];
      const prev=j>0?seq[j-1]:(r.ring?seq[N-1]:null), next=j<N-1?seq[j+1]:(r.ring?seq[0]:null);
      let vin,vout;
      if(prev!=null){const v=vec(seq[j],prev);vin=[v[0],v[1]];}else{const v=vec(seq[j],next);vin=[-v[0],-v[1]];}
      if(next!=null){const v=vec(seq[j],next);vout=[v[0],v[1]];}else vout=[-vin[0],-vin[1]];
      const n0=Math.ceil((nowM-2.5-base)/r.H), n1=Math.floor((nowM+MAXMIN+1-base)/r.H);
      for(let n=n0;n<=n1;n++) s.deps.push({sid:r.id+(dir>0?'a':'b')+n,line:r.line,dir:dirName,dirId:dir>0?1:2,
        min:base+n*r.H-nowM,delay:0,vin,vout,end:!r.ring&&j===N-1});
    }
  }
  const nowMs=Date.now();
  if(!simStall||nowMs>simStall.end+60000){
    const ns=Object.values(st).map(x=>{const r=relFrom(pos,x.lat,x.lon);return [Math.hypot(r.x,r.y),x];}).sort((a,b)=>a[0]-b[0])[0];
    const cand=ns&&ns[1].deps.filter(d=>d.min>2.5&&d.min<6).sort((a,b)=>a.min-b.min)[0];
    if(cand) simStall={sid:cand.sid,t0:nowMs,end:nowMs+90000};
  }
  if(simStall){
    const slip=(Math.min(nowMs,simStall.end)-simStall.t0)/60000;
    for(const x of Object.values(st)) for(const d of x.deps) if(d.sid===simStall.sid){d.min+=slip;d.delay=Math.round(slip*60);}
  }
  return {stations:Object.values(st)};
}

/* ---------- Ortung ---------- */
let locErr='';
function locate(){
  if(!navigator.geolocation){locErr='keine Ortung';hud();return;}
  navigator.geolocation.watchPosition(p=>{
    pos={lat:p.coords.latitude,lon:p.coords.longitude,real:true}; locErr='';
    const moved=lastFetchPos?Math.hypot((pos.lon-lastFetchPos.lon)*68000,(pos.lat-lastFetchPos.lat)*110540):1e9;
    if(!lastFetchPos||!lastFetchPos.real&&pos.real||moved>80) pull(); else hud();
  },e=>{locErr='Ortung aus';hud();},{enableHighAccuracy:true,maximumAge:10000,timeout:20000});
}

/* ---------- Zeichnen ---------- */
function tlabel(d){
  if(d>=1) return 'T-'+Math.ceil(d)+' min';
  if(d>0) return 'T-'+Math.max(1,Math.ceil(d*60))+' s';
  return 'abgefahren';
}
function visible(now){
  const out=[],best=new Map();
  if(!focusId) for(const sh of ships.values()){
    const st=stById.get(sh.sid); if(!st||st.du===undefined) continue;
    const sc=(dOf(sh,now)>-0.3?0:1e6)+st.du,cur=best.get(sh.tid);
    if(!cur||sc<cur.sc) best.set(sh.tid,{sc,key:sh.key});
  }
  for(const sh of ships.values()){
    const st=stById.get(sh.sid); if(!st) continue;
    if(focusId?sh.sid!==focusId:(best.get(sh.tid)||{}).key!==sh.key) continue;
    const d=dOf(sh,now); if(d<=-1.0||d>MAXMIN) continue;
    out.push({sh,st,d});
  }
  return out;
}
const dOf=(sh,now)=>sh.stall?sh.hold:(sh.at-now)/60000;
const stallTxt=(sh,now)=>{const q=Math.max(0,Math.round((now-sh.stallFrom)/1000));return Math.floor(q/60)+':'+String(q%60).padStart(2,'0');};
const short=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
function poly(pts,close=true){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));if(close)ctx.closePath();}

function ground(t){
  const gs=[50,100,200,500,1000,2000,5000].find(g=>g*K>=28)||5000;
  const Rg=Math.ceil((W+2*H)/(2*K)/gs)*gs;
  ctx.strokeStyle='rgba(185,123,255,.2)';ctx.lineWidth=1;ctx.beginPath();
  for(let g=-Rg;g<=Rg;g+=gs){
    let p=P(g,-Rg),q=P(g,Rg);ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);
    p=P(-Rg,g);q=P(Rg,g);ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);
  }
  ctx.stroke();
  const Rm=Math.hypot(W,H)*0.62/K;
  if(!reduce){
    const a=t*0.9;
    for(let i=0;i<14;i++){
      const aa=a-i*0.045;
      ctx.strokeStyle=`rgba(25,240,255,${0.5*(1-i/14)})`;ctx.lineWidth=1.5;
      poly([P(0,0),P(Math.cos(aa)*Rm,Math.sin(aa)*Rm)],false);ctx.stroke();
    }
  }
  const step=[100,250,500,1000,2000,5000].find(r=>r*K>=66)||5000;
  ctx.font='9px "SF Mono",Menlo,monospace';
  for(let r=step,n=0;r<=Rm&&n<14;r+=step,n++){
    const major=r%1000===0;
    ctx.strokeStyle=major?'rgba(255,46,166,.8)':'rgba(255,46,166,.38)';
    ctx.setLineDash(major?[]:[3,5]);ctx.lineWidth=major?1.4:1;
    ctx.beginPath();let lab=null,bd=1e9;
    for(let i=0;i<=72;i++){
      const an=i/72*TAU,p=P(r*Math.cos(an),r*Math.sin(an));
      i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);
      if(p[1]>cy+8){const dd=Math.abs(p[0]-cx);if(dd<bd){bd=dd;lab=p;}}
    }
    ctx.stroke();ctx.setLineDash([]);
    if(lab&&lab[1]<H-190&&lab[0]>20&&lab[0]<W-40){
      ctx.fillStyle='rgba(255,46,166,.9)';ctx.fillText(r>=1000?(r/1000)+' km':r+' m',lab[0]+4,lab[1]-3);}
  }
}

function northMark(){
  const o=P(0,0),n=P(0,1);let vx=n[0]-o[0],vy=n[1]-o[1];const l=Math.hypot(vx,vy)||1;vx/=l;vy/=l;
  const R=Math.min(W*0.40,H*0.28),b=[cx+vx*R,cy+vy*R],a=[cx+vx*(R-16),cy+vy*(R-16)];
  ctx.strokeStyle='#ff2ea6';ctx.lineWidth=1.5;poly([a,b],false);ctx.stroke();
  ctx.fillStyle='#ff2ea6';ctx.font='bold 12px "SF Mono",Menlo,monospace';ctx.fillText('N',b[0]+vx*9-4,b[1]+vy*9+4);
}
function drawYou(){
  const o=focusSt(); if(!o) return;
  const r=relFrom(o,pos.lat,pos.lon); if(Math.hypot(r.x,r.y)>RANGE*1.3) return;
  ctx.strokeStyle='#ffb52e';ctx.lineWidth=1.2;ctx.setLineDash([2,3]);
  poly([[-14,0],[0,-14],[14,0],[0,14]].map(([a,b])=>P(r.x+a,r.y+b)),true);ctx.stroke();ctx.setLineDash([]);
  const q=P(r.x,r.y);ctx.fillStyle='#ffb52e';ctx.font='10px "SF Mono",Menlo,monospace';ctx.fillText('DU',q[0]+8,q[1]+3);
}
function crossHit(x,y,w,h){
  const L=Math.min(W*0.42,170),tp=6;
  return (y<cy+tp&&y+h>cy-tp&&x<cx+L&&x+w>cx-L)||(x<cx+tp&&x+w>cx-tp&&y<cy+L*0.62&&y+h>cy-L*0.62);
}
function crosshair(){
  ctx.strokeStyle='rgba(25,240,255,.9)';ctx.lineWidth=1;ctx.shadowColor='#19f0ff';ctx.shadowBlur=6;
  const g=14,L=Math.min(W*0.42,170);
  poly([[cx-g,cy],[cx-L,cy]],false);ctx.stroke();poly([[cx+g,cy],[cx+L,cy]],false);ctx.stroke();
  poly([[cx,cy-g],[cx,cy-L*0.62]],false);ctx.stroke();poly([[cx,cy+g],[cx,cy+L*0.62]],false);ctx.stroke();
  for(let i=1;i<=4;i++){const o=g+i*((L-g)/5);
    poly([[cx-o,cy-4],[cx-o,cy+4]],false);ctx.stroke();poly([[cx+o,cy-4],[cx+o,cy+4]],false);ctx.stroke();}
  ctx.beginPath();ctx.arc(cx,cy,g-4,0,TAU);ctx.stroke();
  ctx.shadowBlur=0;
}

function drawStation(s,near){
  const c=near?'#ffb52e':'#19f0ff';
  ctx.strokeStyle=c;ctx.lineWidth=1.2;ctx.shadowColor=c;ctx.shadowBlur=5;
  const sc=sMul();poly([[-22,-22],[22,-22],[22,22],[-22,22]].map(([a,b])=>P(s.x+a*sc,s.y+b*sc)));ctx.stroke();
  const b=P(s.x,s.y),t=P(s.x,s.y,30);poly([b,t],false);ctx.stroke();
  ctx.shadowBlur=0;ctx.fillStyle=c;ctx.font='10px "SF Mono",Menlo,monospace';
  const nm=s.name.length>17?s.name.slice(0,16)+'…':s.name;
  {const tt=nm+' '+Math.round(s.du)+'m',w=tt.length*6.1;let ty=t[1]+3;
    if(crossHit(t[0]+6,ty-10,w,14)) ty-=22;
    if((zoom>=0.8||near)&&!crossHit(t[0]+6,ty-10,w,14)) ctx.fillText(tt,t[0]+6,ty);}
  const m=P(s.x,s.y,15);s.sx=m[0];s.sy=m[1];
}

function shipPos(sh,st,d){
  if(sh.vin){const v=d>0?sh.vin:sh.vout,L=Math.abs(d)*SPEED;
    return {x:st.x+v[0]*L,y:st.y+v[1]*L,h:d>0?[-sh.vin[0],-sh.vin[1]]:sh.vout};}
  const dv=[Math.cos(sh.ang),Math.sin(sh.ang)];
  return {x:st.x+dv[0]*d*SPEED,y:st.y+dv[1]*d*SPEED,h:[-dv[0],-dv[1]]};
}
function drawShip(sh,st,d,t){
  const stall=!!sh.stall, c=(stall&&Math.sin(t*8)>0)?'#ff2e4d':col(sh.line), q=shipPos(sh,st,d), x=q.x, y=q.y, h=q.h, p=[-h[1],h[0]];
  let a=1; if(d>MAXMIN-1) a=Math.max(0,MAXMIN-d); if(d<-0.5) a=Math.max(0,1-(-0.5-d)/0.5); if(sh.end&&d<0) a=Math.max(0,1+d/0.35);
  const z=16+(reduce?0:Math.sin(t*2.2+sh.ang*3)*2);
  const sc=sMul(),W3=(f,l,zz)=>P(x+(h[0]*f+p[0]*l)*sc,y+(h[1]*f+p[1]*l)*sc,zz);
  const shape=[[110,0],[-60,60],[-35,0],[-60,-60]];
  ctx.globalAlpha=a;
  if(stall&&!reduce){
    for(const off of [0,0.5]){
      const ph=((t*0.9)+off)%1, r=60+ph*340;
      ctx.strokeStyle=`rgba(255,46,77,${(1-ph)*0.9})`;ctx.lineWidth=2;ctx.beginPath();
      for(let i=0;i<=28;i++){const an=i/28*TAU,pp=P(x+Math.cos(an)*r*sc,y+Math.sin(an)*r*sc,0);i?ctx.lineTo(pp[0],pp[1]):ctx.moveTo(pp[0],pp[1]);}
      ctx.stroke();
    }
    ctx.globalAlpha=a*(0.5+0.5*Math.abs(Math.sin(t*4)));
  }
  // Schatten + Lot
  ctx.fillStyle='rgba(255,46,166,.22)';poly(shape.map(([f,l])=>W3(f,l,0)));ctx.fill();
  ctx.strokeStyle=c+'88';ctx.lineWidth=1;ctx.setLineDash([2,3]);poly([P(x,y,0),P(x,y,z)],false);ctx.stroke();ctx.setLineDash([]);
  // Kondensstreifen
  const t0=W3(-35,0,z),t1=W3(-35-300,0,z),gr=ctx.createLinearGradient(t0[0],t0[1],t1[0],t1[1]);
  gr.addColorStop(0,c+'cc');gr.addColorStop(1,c+'00');
  ctx.strokeStyle=gr;ctx.lineWidth=2;poly([t0,t1],false);ctx.stroke();
  // Schiff
  ctx.shadowColor=c;ctx.shadowBlur=10;ctx.fillStyle='#0b0620';ctx.strokeStyle=c;ctx.lineWidth=1.6;
  poly(shape.map(([f,l])=>W3(f,l,z)));ctx.fill();ctx.stroke();
  ctx.lineWidth=1;poly([W3(110,0,z),W3(-35,0,z)],false);ctx.stroke();
  poly([W3(-30,0,z),W3(-55,0,z+10)],false);ctx.stroke();
  if(d>0&&!stall){ctx.strokeStyle=Math.random()<.5?'#ff2ea6':'#ffb52e';ctx.lineWidth=2;
    poly([W3(-38,0,z),W3(-38-40-Math.random()*50,0,z)],false);ctx.stroke();}
  // Beschriftung
  ctx.shadowBlur=0;const lp=P(x,y,z),cw=6.7,tx=lp[0]+13;
  ctx.font='bold 11px "SF Mono",Menlo,monospace';ctx.fillStyle=c;
  if(zoom>=0.8){
    const l1=sh.line+' ▸ '+short(sh.dir||'',16);
    const l2=(stall?'steht '+stallTxt(sh,Date.now()):tlabel(d))+(!stall&&sh.delay>=60&&d>0?'  +'+Math.round(sh.delay/60)+' Verspät.':'');
    if(!crossHit(tx,lp[1]-25,Math.max(l1.length,l2.length)*cw,28)){
      ctx.fillText(l1,tx,lp[1]-14);
      ctx.font='11px "SF Mono",Menlo,monospace';ctx.fillStyle=stall?'#ff2e4d':(d>0?'#ffffff':'#8f84b8');
      ctx.fillText(l2,tx,lp[1]-2);
    }
  } else {
    const t1=stall?sh.line+' steht':(d>0&&d<6?sh.line+' '+(d>=1?Math.ceil(d)+'′':'<1′'):'');
    if(t1&&!crossHit(lp[0]+11,lp[1]-16,t1.length*cw,16)) ctx.fillText(t1,lp[0]+11,lp[1]-4);
  }
  ctx.globalAlpha=1;
}

function frame(ts){
  const t=ts/1000, now=Date.now();
  const g=ctx.createRadialGradient(cx,cy,10,cx,cy,W*0.8);g.addColorStop(0,'#1a0d46');g.addColorStop(1,'#0b0620');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  zoom+=(zoomT-zoom)*0.25;K=K0*zoom;tI+=((view==='iso'?1:0)-tI)*0.12;
  const tgt=cmpOn?Math.atan2(hs,hc)-(view==='iso'?Math.PI/4:0):0;
  let df=tgt-rotCur;df=Math.atan2(Math.sin(df),Math.cos(df));rotCur+=df*0.12;cR=Math.cos(rotCur);sR=Math.sin(rotCur);
  ground(t);northMark();
  for(const s of stations){const r=rel(s.lat,s.lon);s.x=r.x;s.y=r.y;const u=relFrom(pos,s.lat,s.lon);s.du=Math.hypot(u.x,u.y);}
  const shown=focusId?stations.filter(s=>s.id===focusId):stations;
  const nearest=focusId?null:stations.reduce((m,s)=>(!m||s.du<m.du)?s:m,null);
  for(const [k,sh] of ships) if(dOf(sh,now)<-1.1) ships.delete(k);
  const items=[], lanes=new Set();
  for(const {sh,st,d} of visible(now)){
    if(st.x===undefined) continue;
    const vs=sh.vin?[sh.vin,sh.vout]:[[Math.cos(sh.ang),Math.sin(sh.ang)]];
    for(const v of vs){const lk=sh.sid+'|'+sh.line+'|'+v[0].toFixed(2)+','+v[1].toFixed(2);
      if(lanes.has(lk)) continue; lanes.add(lk);
      const c=col(sh.line);ctx.strokeStyle=c+'33';ctx.lineWidth=1;ctx.setLineDash([4,6]);
      poly([P(st.x,st.y),P(st.x+v[0]*MAXMIN*SPEED,st.y+v[1]*MAXMIN*SPEED)],false);ctx.stroke();ctx.setLineDash([]);}
    const sp=shipPos(sh,st,d);
    items.push({sy:P(sp.x,sp.y)[1],f:()=>drawShip(sh,st,d,t)});
  }
  for(const s of shown) items.push({sy:P(s.x,s.y)[1],f:()=>drawStation(s,focusId?true:s===nearest)});
  items.sort((a,b)=>a.sy-b.sy).forEach(i=>i.f());
  drawYou();crosshair();
  requestAnimationFrame(frame);
}

/* ---------- HUD ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

  cb.classList.toggle('on',cmpOn&&Date.now()-lastOri<=2500);cb.classList.toggle('bad',cmpOn&&Date.now()-lastOri>2500);
  st.classList.toggle('bad',failed||(!pos.real&&!!locErr));

  rows.innerHTML=list.map(({sh,st:s,d})=>{

      `<div class="t">${sh.stall?'steht '+stallTxt(sh,now):tlabel(d)}${!sh.stall&&sh.delay>=60?' <u>+'+Math.round(sh.delay/60)+'</u>':''}</div></div>`;
  }).join('');
  rows.scrollTop=sc;
}

/* Kompass */
function onOri(e){
  let h=null;
  if(typeof e.webkitCompassHeading==='number') h=e.webkitCompassHeading;
  else if(e.absolute&&e.alpha!=null) h=360-e.alpha;
  if(h==null||isNaN(h)) return;
  const r=h*Math.PI/180; hs+=(Math.sin(r)-hs)*0.25; hc+=(Math.cos(r)-hc)*0.25; lastOri=Date.now();
}
async function toggleCompass(){
  if(cmpOn){cmpOn=false;removeEventListener('deviceorientation',onOri,true);removeEventListener('deviceorientationabsolute',onOri,true);hud();return;}
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      if(await DeviceOrientationEvent.requestPermission()!=='granted') return;
    }
  }catch(e){return;}
  addEventListener('deviceorientation',onOri,true);addEventListener('deviceorientationabsolute',onOri,true);
  cmpOn=true;lastOri=Date.now();hud();
}
$('#cmp').addEventListener('click',toggleCompass);

document.addEventListener('gesturestart',e=>e.preventDefault());
const ptr=new Map();let pd0=1,z0=1,pinched=false,lastTap=0;

  if(ptr.size===2){const [a,b]=[...ptr.values()];pd0=Math.hypot(a[0]-b[0],a[1]-b[1])||1;z0=zoomT;pinched=true;}
  else if(ptr.size===1) pinched=false;
});

/* Stationen: Fokus, Merkliste, Suche */
const savePins=()=>store.set('pins',JSON.stringify(pins));
function isPinned(id){return pins.some(p=>p.id===id);}
function togglePin(st){
  if(isPinned(st.id)) pins=pins.filter(p=>p.id!==st.id);
  else pins.push({id:st.id,name:st.name,lat:st.lat,lon:st.lon});
  savePins();renderChips();pull();
}
function setFocus(id,st){
  focusId=id; tmp=st?{id:st.id,name:st.name,lat:st.lat,lon:st.lon}:null;
  renderChips();hud();
}
function renderChips(){
  const el=$('#chips');el.textContent='';
  const mk=(label,on,fn)=>{const b=document.createElement('button');b.className='chip'+(on?' on':'');b.textContent=label;b.onclick=fn;el.appendChild(b);return b;};
  mk('Alle',!focusId,()=>setFocus(null));
  const list=pins.slice(); if(focusId&&!isPinned(focusId)&&tmp) list.push(tmp);
  for(const p of list){
    const on=focusId===p.id, nm=p.name.length>16?p.name.slice(0,15)+'…':p.name, b=mk((isPinned(p.id)&&!on?'★ ':'')+nm,on,()=>setFocus(p.id,p));
    if(on){const s=document.createElement('span');s.className='pin';s.textContent=isPinned(p.id)?'★':'☆';
      s.onclick=ev=>{ev.stopPropagation();togglePin(p);};b.appendChild(s);}
  }
  mk('＋',false,()=>{const sh=$('#sheet');sh.hidden=!sh.hidden;if(!sh.hidden){$('#q').value='';search();$('#q').focus();}});
}
const netList=()=>NET.st.map((e,i)=>({id:'S'+i,name:e[0],lat:e[1],lon:e[2]}));
const nrm=x=>x.toLowerCase().replace(/\(.*?\)/g,'').replace(/[\s.\-]/g,'');
function nearbyList(){return netList().map(s=>{const r=relFrom(pos,s.lat,s.lon);s.du=Math.hypot(r.x,r.y);return s;}).sort((a,b)=>a.du-b.du).slice(0,8);}
async function search(){
  const q=$('#q').value.trim(); let list=[];
  try{
    if(!q) list=nearbyList();
    else {const k=nrm(q);list=netList().filter(s=>nrm(s.name).includes(k)).sort((a,b)=>(nrm(b.name).startsWith(k)-nrm(a.name).startsWith(k))||a.name.length-b.name.length).slice(0,8);}
  }catch(e){list=[];}
  const res=$('#res');res.textContent='';
  if(!list.length){const d=document.createElement('div');d.textContent=q?'Keine Station gefunden':'Keine Stationen in der Nähe';res.appendChild(d);return;}
  for(const s of list){
    const d=document.createElement('div'),n=document.createElement('span'),i=document.createElement('i');
    n.textContent=s.name;const u=relFrom(pos,s.lat,s.lon);i.textContent=Math.round(Math.hypot(u.x,u.y))+' m';
    d.append(n,i);
    d.onclick=()=>{const st={id:String(s.id),name:s.name,lat:s.lat,lon:s.lon};
      if(!isPinned(st.id)){pins.push(st);savePins();}
      $('#sheet').hidden=true;setFocus(st.id,st);pull();};
    res.appendChild(d);
  }
}
let qT;$('#q').addEventListener('input',()=>{clearTimeout(qT);qT=setTimeout(search,250);});
cv.addEventListener('click',ev=>{
  const r=cv.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;
  let best=null,bd=34;
  for(const s of stations){if(s.sx===undefined)continue;const d=Math.hypot(s.sx-x,s.sy-y);if(d<bd){bd=d;best=s;}}
  if(pinched) return;
  if(best&&best.id!==focusId) setFocus(best.id,best);
  else if(!best){$('#sheet').hidden=true;const nw=Date.now();if(nw-lastTap<320)zoomT=1;lastTap=nw;}
});

$('#st').addEventListener('click',()=>{locate();pull();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull();});
setInterval(hud,1000);
setInterval(pull,POLL_MS);
renderChips();locate();pull();requestAnimationFrame(frame);
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
